name: React Portfolio CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Grant push permissions to GITHUB_TOKEN so the runner can publish the compiled /build folder to the gh-pages branch
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Verify Webpack Compilation
      run: npm run build
      env:
        CI: true

    - name: Run Jest Unit Tests
      run: npm test -- --watchAll=false
      env:
        CI: true

    # Deploy to GitHub Pages. Only executes on pushes to the main branch after tests pass successfully.
    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
